<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Банк — Главная</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Эмуляция экрана телефона */
        .phone-frame {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
        }

        /* Шапка */
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 20px 20px 30px;
            border-radius: 0 0 25px 25px;
            flex-shrink: 0;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .user-name {
            font-size: 16px;
            opacity: 0.9;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .balance-label {
            font-size: 13px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .balance-amount small {
            font-size: 18px;
            font-weight: 400;
            opacity: 0.8;
        }

        /* Быстрые действия */
        .quick-actions {
            display: flex;
            justify-content: space-around;
            padding: 20px 10px;
            background: #ffffff;
            margin-top: -15px;
            border-radius: 20px 20px 0 0;
            position: relative;
            z-index: 2;
            flex-shrink: 0;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            cursor: pointer;
            color: #1e3c72;
            font-size: 12px;
            font-weight: 500;
            transition: transform 0.1s;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-icon {
            width: 48px;
            height: 48px;
            background: #eef2f9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #1e3c72;
        }

        /* Список операций */
        .transactions {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 20px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin: 15px 0 10px;
        }

        .transaction-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .transaction-item:last-child {
            border-bottom: none;
        }

        .tx-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: #f0f4ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .tx-details {
            flex: 1;
            min-width: 0;
        }

        .tx-name {
            font-size: 14px;
            font-weight: 500;
            color: #222;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tx-date {
            font-size: 12px;
            color: #999;
            margin-top: 3px;
        }

        .tx-amount {
            font-size: 15px;
            font-weight: 600;
            text-align: right;
            white-space: nowrap;
            margin-left: 10px;
        }

        .tx-amount.income { color: #27ae60; }
        .tx-amount.expense { color: #333; }

        /* Нижняя навигация */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 10px 0 15px;
            background: #ffffff;
            border-top: 1px solid #eee;
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 10px;
            cursor: pointer;
            font-weight: 500;
        }

        .nav-item.active {
            color: #1e3c72;
        }

        .nav-icon {
            font-size: 20px;
        }

        /* Стили скроллбара */
        .transactions::-webkit-scrollbar {
            width: 4px;
        }
        .transactions::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 2px;
        }
    </style>
</head>
<body>

<div class="phone-frame">
    <!-- Шапка с балансом -->
    <div class="header">
        <div class="header-top">
            <span class="user-name">Добрый день, Александр</span>
            <div class="avatar">А</div>
        </div>
        <div class="balance-label">Основной счёт ·· 4821</div>
        <div class="balance-amount">1 250 000 <small>₽</small></div>
    </div>

    <!-- Быстрые действия -->
    <div class="quick-actions">
        <button class="action-btn" onclick="alert('Перевод по СБП (заглушка)')">
            <div class="action-icon">↗</div>
            <span>Перевести</span>
        </button>
        <button class="action-btn" onclick="alert('Оплата по QR (заглушка)')">
            <div class="action-icon">▦</div>
            <span>Оплатить</span>
        </button>
        <button class="action-btn" onclick="alert('Пополнение (заглушка)')">
            <div class="action-icon">↓</div>
            <span>Пополнить</span>
        </button>
        <button class="action-btn" onclick="alert('История (заглушка)')">
            <div class="action-icon">≡</div>
            <span>История</span>
        </button>
    </div>

    <!-- Список операций -->
    <div class="transactions">
        <div class="section-title">Последние операции</div>

        <div class="transaction-item">
            <div class="tx-icon">🍔</div>
            <div class="tx-details">
                <div class="tx-name">Вкусно — и точка</div>
                <div class="tx-date">Сегодня, 14:32</div>
            </div>
            <div class="tx-amount expense">− 450 ₽</div>
        </div>

        <div class="transaction-item">
            <div class="tx-icon">💸</div>
            <div class="tx-details">
                <div class="tx-name">Перевод от Ивана П.</div>
                <div class="tx-date">Сегодня, 09:15</div>
            </div>
            <div class="tx-amount income">+ 12 000 ₽</div>
        </div>

        <div class="transaction-item">
            <div class="tx-icon">🚇</div>
            <div class="tx-details">
                <div class="tx-name">Транспорт</div>
                <div class="tx-date">Вчера, 18:40</div>
            </div>
            <div class="tx-amount expense">− 65 ₽</div>
        </div>

        <div class="transaction-item">
            <div class="tx-icon">📱</div>
            <div class="tx-details">
                <div class="tx-name">МТС · Связь</div>
                <div class="tx-date">Вчера, 10:00</div>
            </div>
            <div class="tx-amount expense">− 600 ₽</div>
        </div>

        <div class="transaction-item">
            <div class="tx-icon">🏪</div>
            <div class="tx-details">
                <div class="tx-name">Магнит</div>
                <div class="tx-date">12 ноя, 19:22</div>
            </div>
            <div class="tx-amount expense">− 2 340 ₽</div>
        </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="bottom-nav">
        <button class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>Главная</span>
        </button>
        <button class="nav-item">
            <span class="nav-icon">💳</span>
            <span>Карты</span>
        </button>
        <button class="nav-item">
            <span class="nav-icon">📊</span>
            <span>Платежи</span>
        </button>
        <button class="nav-item">
            <span class="nav-icon">👤</span>
            <span>Профиль</span>
        </button>
    </div>
</div>

</body>
</html>
